<svg xmlns="http://www.w3.org/2000/svg" width="750" height="380" viewBox="0 0 750 380">
    <rect width="750" height="380" fill="#000000"/>
    <g stroke="#ffffff" stroke-width="1">
        <!-- Horizontal grid lines -->
        <line x1="0" y1="125" x2="750" y2="125"/>
        <line x1="0" y1="250" x2="750" y2="250"/>
        <line x1="0" y1="300" x2="750" y2="300"/>

        <!-- Vertical grid lines (Top and Mid sections) -->
        <line x1="100" y1="0" x2="100" y2="250"/>
        <line x1="200" y1="0" x2="200" y2="250"/>
        <line x1="250" y1="0" x2="250" y2="250"/>
        <line x1="500" y1="0" x2="500" y2="250"/>

        <!-- Vertical grid lines (Oscillator Sub-sections) -->
        <line x1="50" y1="0" x2="50" y2="62.5"/>
        <line x1="50" y1="125" x2="50" y2="187.5"/>
        <line x1="0" y1="31.25" x2="100" y2="31.25"/>
        <line x1="0" y1="156.25" x2="100" y2="156.25"/>
        <line x1="0" y1="62.5" x2="200" y2="62.5"/>
        <line x1="0" y1="187.5" x2="200" y2="187.5"/>

        <!-- Vertical grid lines (ADSR Sub-sections) -->
        <line x1="562.5" y1="0" x2="562.5" y2="125"/>
        <line x1="625" y1="0" x2="625" y2="125"/>
        <line x1="687.5" y1="0" x2="687.5" y2="125"/>

        <line x1="550" y1="125" x2="550" y2="250"/>
        <line x1="600" y1="125" x2="600" y2="250"/>
        <line x1="650" y1="125" x2="650" y2="250"/>
        <line x1="700" y1="125" x2="700" y2="250"/>

        <!-- Vertical grid lines (Bottom section) -->
        <line x1="125" y1="300" x2="125" y2="380"/>
        <line x1="375" y1="300" x2="375" y2="380"/>
        <line x1="62.5" y1="300" x2="62.5" y2="340"/>
        <line x1="0" y1="340" x2="125" y2="340"/>

        <!-- Vertical grid lines (Effects Sub-sections) -->
        <line x1="437.5" y1="300" x2="437.5" y2="380"/>
        <line x1="500" y1="300" x2="500" y2="380"/>
        <line x1="562.5" y1="300" x2="562.5" y2="380"/>
        <line x1="625" y1="300" x2="625" y2="380"/>
        <line x1="687.5" y1="300" x2="687.5" y2="380"/>
        
        <!-- Sequencer steps grid lines -->
        <line x1="46.875" y1="250" x2="46.875" y2="300"/>
        <line x1="93.75" y1="250" x2="93.75" y2="300"/>
        <line x1="140.625" y1="250" x2="140.625" y2="300"/>
        <line x1="187.5" y1="250" x2="187.5" y2="300"/>
        <line x1="234.375" y1="250" x2="234.375" y2="300"/>
        <line x1="281.25" y1="250" x2="281.25" y2="300"/>
        <line x1="328.125" y1="250" x2="328.125" y2="300"/>
        <line x1="375" y1="250" x2="375" y2="300"/>
        <line x1="421.875" y1="250" x2="421.875" y2="300"/>
        <line x1="468.75" y1="250" x2="468.75" y2="300"/>
        <line x1="515.625" y1="250" x2="515.625" y2="300"/>
        <line x1="562.5" y1="250" x2="562.5" y2="300"/>
        <line x1="609.375" y1="250" x2="609.375" y2="300"/>
        <line x1="656.25" y1="250" x2="656.25" y2="300"/>
        <line x1="703.125" y1="250" x2="703.125" y2="300"/>
    </g>
</svg>